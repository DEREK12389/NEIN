
name: NEIN macOS Environment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26

    steps:
      - name: Download NEIN source
        uses: actions/checkout@v4

      - name: Check macOS
        run: sw_vers

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --find clang
          xcrun --find codesign

      - name: Check Python
        run: python3 --version

      - name: Check NEIN
        run: python3 tools/main.py --help
